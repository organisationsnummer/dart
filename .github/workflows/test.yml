name: test

on:
  push:
    branches:
      - main

  # Run tests for any PRs.
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
    - name: Install dependencies
      run: dart pub get
    - name: Analyze
      run: dart analyze
    - name: Run tests
      run: dart test test/organisationsnummer.dart
